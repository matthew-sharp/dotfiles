# Approximates the old bash-git-prompt "Single_line" theme:
# ✔ user ~/path on branch [status] $
# ✘-1 user ~/path $
add_newline = false
format = '$character$status $username$directory$git_branch$git_state$git_status\$ '

[username]
show_always = true
format = '[$user]($style) '
style_user = 'bold blue'
style_root = 'bold red'

[character]
format = '$symbol'
success_symbol = '[✔](bold green)'
error_symbol = '[✘](bold red)'

[status]
disabled = false
format = '[-$status]($style)'
style = 'bold red'

[directory]
style = 'bold green'
truncation_length = 100
truncate_to_repo = false
